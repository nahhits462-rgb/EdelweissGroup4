<!DOCTYPE html>
<html>
  <head>
    <title>The HTML Form</title>
  </head>
  <body style="background-color: lightblue;">
    <h1 style="text-align:center; color: darkblue;">
      Individual Student Information
    </h1>

    <form style="background-color: #FFEEEE; padding: 15px; border-radius: 10px;">
      
      <fieldset>
        <legend style="color: red; font-weight: bold;">Personal Information</legend>
        <label style="color: darkblue;">First Name:</label><br>
        <input type="text" name="fname"><br><br>
        <label style="color: darkblue;">Middle Name:</label><br>
        <input type="text" name="mname"><br><br>
        <label style="color: darkblue;">Last Name:</label><br>
        <input type="text" name="lname"><br><br>
        <label style="color: darkgreen; font-weight: bold;">Sex:</label><br>
        <input type="radio" id="male" name="sex" value="Male">
        <label for="male" style="color: red;">Male</label>
        <input type="radio" id="female" name="sex" value="Female">
        <label for="female" style="color: green;">Female</label>
      </fieldset>
      <br>

      <fieldset>
        <legend style="color: red; font-weight: bold;">Academic Year</legend>
        <label style="color: purple;">Grade Level:</label><br>
        <input type="text" name="grade"><br><br>
        <label style="color: purple;">Section:</label><br>
        <input type="text" name="section"><br><br>
        <label style="color: purple;">School Year:</label><br>
        <input type="text" name="schoolyear"><br><br>
      </fieldset>
      <br>

      <fieldset>
        <legend style="color: red; font-weight: bold;">Individual Preferences</legend>
        <label style="color: brown;">Favorite Food:</label><br>
        <input type="text" name="food"><br><br>
        <label style="color: blue;">Favorite Color:</label><br>
        <input type="text" name="color"><br><br>
        <label style="color: green;">Favorite Person:</label><br>
        <input type="text" name="person"><br><br>

        <label style="color: purple; font-weight: bold;">Things you like to do:</label><br>
        <input type="checkbox" id="sports" name="hobby1">
        <label for="sports" style="color: orange;">Sports</label>
        <input type="checkbox" id="music" name="hobby2">
        <label for="music" style="color: purple;">Music</label>
        <input type="checkbox" id="art" name="hobby3">
        <label for="art" style="color: green;">Art</label>
        <input type="checkbox" id="sleeping" name="hobby4">
        <label for="sleeping" style="color: red;">Sleeping</label>
        <input type="checkbox" id="goingout" name="hobby5">
        <label for="goingout" style="color: blue;">Going Out</label>
        <br><br>

        <label for="country" style="color: darkgreen; font-weight: bold;">Dream Country:</label><br>
        <select id="country" name="country">
          <option value="Japan">Japan</option>
          <option value="Korea">Korea</option>
          <option value="USA">USA</option>
          <option value="Canada">Canada</option>
          <option value="Switzerland">Switzerland</option>
        </select>
        <br><br>

        <label for="chocolate" style="color: brown; font-weight: bold;">Chocolate</label><br>
        <select id="chocolate" name="chocolate">
          <option value="Kisses">Kisses</option>
          <option value="Toblerone">Toblerone</option>
          <option value="Cadbury">Cadbury</option>
          <option value="KitKat">KitKat</option>
          <option value="Ferrero">Ferrero</option>
        </select>
        <br><br>

        <label for="snacks" style="color: #CC0066; font-weight: bold;">Snacks/Chips:</label><br>
        <select id="snacks" name="snacks" size="4">
          <option value="Chippy">Chippy</option>
          <option value="Nova">Nova</option>
          <option value="Piatos">Piatos</option>
          <option value="Hamburger">Hamburger</option>
          <option value="Cheese Curls">Cheese Curls</option>
          <option value="Doritos">Doritos</option>
          <option value="Lays">Lays</option>
          <option value="Cheetos">Cheetos</option>
        </select>
      </fieldset>
      <br>

      <fieldset>
        <legend style="color: red; font-weight: bold;">Other Information</legend>
        <label style="font-weight: bold;">Where do you live in CALABARZON:</label><br><br>
        <input list="CALABARZON" name="calabarzon">
        <datalist id="CALABARZON">
          <option value="Cavite">
          <option value="Laguna">
          <option value="Batangas">
          <option value="Rizal">
          <option value="Quezon">
        </datalist>
        <br><br><br>
        <label style="font-weight: bold;">Type your comment/suggestion here:</label><br><br>
        <textarea name="comment" rows="8" cols="35"></textarea>
        <br><br>
        <button type="button" onclick="alert('Student Information')">Press this button</button>
      </fieldset>
      <br>
!
